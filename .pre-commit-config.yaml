repos:
  # --- Standardowe hooki ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        # mkdocs.yml używa tagów `!!python/name:` (emoji/ikony Material), których
        # bezpieczny loader check-yaml nie potrafi skonstruować. Waliduje go
        # natomiast `mkdocs build --strict` (workflow docs.yml).
        exclude: ^mkdocs\.yml$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # --- ShellCheck — linter dla bash/sh ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['-e', 'SC1091,SC2086']  # SC1091: can't follow sourced file, SC2086: double quote to prevent globbing

  # --- Wykrywanie sekretów (TruffleHog) ---
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.88.26
    hooks:
      - id: trufflehog
        # Jeden proces na commit (pass_filenames: false) i wspólny limit RAM przez
        # ~/.config/systemd/user/trufflehog.slice (chezmoi); bez systemd (CI, macOS)
        # biegnie zwykłe wywołanie.
        entry: bash -c 't="trufflehog git file://. --since-commit HEAD --only-verified --fail --no-update --concurrency=6"; if command -v systemd-run >/dev/null && [ -S "${XDG_RUNTIME_DIR:-/nonexistent}/bus" ]; then exec systemd-run --user --scope --quiet --collect --slice=trufflehog.slice $t; else exec $t; fi'
        require_serial: true
