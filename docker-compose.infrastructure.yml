x-logging: &default-logging
  driver: "local"
  options:
    max-size: "${LOG_MAX_SIZE:-150m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:

  # Jednorazowe przygotowanie rzeczy, ktorych nginx sam sobie nie udostepni.
  # MUSI poprzedzac webserver.
  #
  # PO CO: obraz `owasp/modsecurity-crs:nginx` jest zbudowany na
  # NIEUPRZYWILEJOWANYM wariancie nginksa — `USER nginx` (uid 101), pid w /tmp.
  # Oficjalny obraz `nginx`, ktorego uzywalismy przed migracja na WAF, startowal
  # mastera jako root i czytal wszystko. Teraz kazdy plik, ktory nginx ma
  # otworzyc, musi byc dostepny dla uid 101 — a dwie rzeczy nie sa:
  #
  # 1. WOLUMEN ACCESS LOGU. Docker tworzy swiezy wolumen nazwany jako
  #    `root:root 0755`, wiec uid 101 nie zalozy w nim pliku:
  #      [emerg] open() ".../bpp_access.log" failed (13: Permission denied)
  #    i nginx nie wstaje wcale. Dotyka kazdej swiezej instalacji oraz kazdej,
  #    ktorej wolumen odtworzono (`make prune-orphan-volumes`, `make refresh`).
  #
  # 2. KLUCZE PRYWATNE. `generate-snakeoil-certs.sh` zostawia klucz z domyslnym
  #    trybem openssl (0600), a certbot ma na sztywno BASE_PRIVKEY_MODE = 0o600
  #    i tworzy `live/` oraz `archive/` jako 0700 — wszystko wlasnoscia roota.
  #    Dla uid 101 to zarowno brak wejscia do katalogu, jak i brak odczytu:
  #      [emerg] cannot load certificate key ... Permission denied
  #    Sprawdzone na obu sciezkach; w trybie `letsencrypt` przy braku certu
  #    30-render-bpp-vhosts.sh spada na te same snakeoile, wiec problem dotyczy
  #    obu trybow SSL.
  #
  # MODEL UPRAWNIEN: wlascicielem zostaje root, GRUPA to `nginx`, tryb 0640
  # (katalogi 0750). Klucz czyta root i nginx — i nikt wiecej. NIE robimy go
  # czytelnym dla swiata; sprawdzone, ze uid spoza grupy dostaje odmowe.
  #
  # DLACZEGO NIE `user: root` NA WEBSERVERZE: to skasowaloby hardening, ktory
  # CRS wprowadzil celowo. Ten kontener jest rootem przez chwile i tylko po to,
  # zeby oddac pliki nginksowi.
  #
  # `chown`/`chgrp` po NAZWIE, nie po uid: gdyby upstream zmienil uid, nazwa
  # nadal wskaze wlasciwego uzytkownika, a twarde 101 cicho przestaloby pasowac.
  #
  # Uruchamia sie przy KAZDYM `make up`, wiec naprawia takze instalacje juz
  # zepsute i certy wygenerowane recznie po wdrozeniu. Odnowienia Let's Encrypt
  # miedzy restartami domyka deploy-hook certbota (patrz
  # docker-compose.application.yml i scripts/letsencrypt.sh).
  #
  # Ten sam obraz co webserver — zero dodatkowego pobierania (warstwy wspoldzielone).
  webserver-init:
    image: owasp/modsecurity-crs:nginx
    user: "0:0"
    # Jednorazowy: ma sie wykonac i skonczyc. `restart: always` (jak reszta
    # serwisow w tym pliku) zapetlilby go w nieskonczonosc.
    restart: "no"
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown -R nginx:nginx /var/log/nginx-shared
        if [ -d /etc/ssl/private ]; then
          chown -R 0:nginx /etc/ssl/private
          find /etc/ssl/private -type d -exec chmod 0750 {} +
          find /etc/ssl/private -type f -exec chmod 0640 {} +
        fi
        # TYLKO live/ i archive/. `accounts/` CELOWO pomijamy — siedzi tam
        # klucz konta ACME, ktorym mozna wystawiac i odwolywac certy. Nginx
        # nie ma powodu go czytac.
        for d in /etc/letsencrypt/live /etc/letsencrypt/archive; do
          [ -d "$d" ] || continue
          chgrp -R nginx "$d"
          chmod -R g+rX "$d"
        done
    volumes:
      - nginx_access_log:/var/log/nginx-shared
      # RW (w webserverze jest :ro) — tutaj wlasnie poprawiamy uprawnienia.
      - ${BPP_CONFIGS_DIR}/ssl:/etc/ssl/private
      - ${BPP_CONFIGS_DIR}/letsencrypt:/etc/letsencrypt

  webserver:
    # WAF na brzegu: obraz OWASP CRS = ten sam oficjalny nginx + modul
    # ModSecurity + reguly Core Rule Set. Zawiera --with-http_v3_module,
    # wiec HTTP/3 ponizej dziala jak dotad. Szczegoly i uzasadnienie:
    # docs/architektura/waf.md
    image: owasp/modsecurity-crs:nginx
    restart: always
    logging: *default-logging
    env_file: ${BPP_CONFIGS_DIR}/.env
    environment:
      # ── ModSecurity / CRS ───────────────────────────────────────────────
      # BLOKUJE. Zadanie z rozpoznanym atakiem dostaje 403 od ModSecurity,
      # ktore _bpp-locations.conf zamienia na 444 (zerwane polaczenie bez
      # odpowiedzi). Dwie sciezki sa z tego wylaczone i tylko obserwowane —
      # patrz reguly 10002/10003 w modsecurity-override.conf.template.
      # Awaryjne zejscie do obserwacji: MODSEC_RULE_ENGINE=DetectionOnly w .env.
      # HTTP/3 MUSI byc na liscie dozwolonych wersji protokolu, inaczej regula
      # 920430 ("HTTP protocol version is not allowed by policy") zapala sie na
      # KAZDYM zadaniu h3. Ma severity CRITICAL = 5 pkt, czyli dokladnie prog
      # blokowania — jedno trafienie wystarcza, zeby zerwac polaczenie.
      #
      # Domyslna lista CRS to "HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0" (REQUEST-901,
      # regula 900230) i po prostu nie zna HTTP/3. My h3 wlaczamy swiadomie
      # (listen 443 quic + Alt-Svc), wiec deklarujemy to wprost — lepsze niz
      # wylaczanie reguly, bo polityka wersji zostaje egzekwowana.
      #
      # WYKRYTE 2026-08-05: obraz `owasp/modsecurity-crs:nginx` to tag PLYWAJACY;
      # przebudowa z tego dnia zaczela egzekwowac 920430 i `make test-waf` zlapal
      # blokade legalnego GET / po h3. Bez tego przy najblizszym `make up`
      # przegladarki przelaczone na h3 (Alt-Svc trzyma je tam dobe) traca dostep.
      ALLOWED_HTTP_VERSIONS: "${ALLOWED_HTTP_VERSIONS:-HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0 HTTP/3 HTTP/3.0}"
      MODSEC_RULE_ENGINE: "${MODSEC_RULE_ENGINE:-On}"
      BLOCKING_PARANOIA: "${BLOCKING_PARANOIA:-1}"
      # Limity ciala zadania MUSZA byc spojne z client_max_body_size 120M
      # z vhost.conf.template. Domyslne w ModSecurity to 13107200 (12,5 MiB)
      # i 131072 (128 KiB) — przy nich importy POLON/PBN oraz duze formularze
      # (DATA_UPLOAD_MAX_NUMBER_FIELDS=50000) leca 413.
      MODSEC_REQ_BODY_LIMIT: "${MODSEC_REQ_BODY_LIMIT:-132120576}"
      MODSEC_REQ_BODY_NOFILES_LIMIT: "${MODSEC_REQ_BODY_NOFILES_LIMIT:-4194304}"
      # Czesci transakcji zapisywane do audit logu. Domyslne w obrazie to
      # ABIJDEFHZ — a to oznacza, ze do stdout (-> Docker -> Alloy -> Loki)
      # leci `I` (CIALO ZADANIA) i `E` (CIALO ODPOWIEDZI, do 1 MiB HTML-a).
      # Poza absurdalna objetoscia to problem z danymi osobowymi: oflagowany
      # POST na formularz logowania zapisalby przeslane haslo, a oflagowana
      # strona — jej pelna tresc.
      #   A = naglowek transakcji, W TYM LINIA ZADANIA Z URI (czyli payload)
      #   H = komunikaty regul (ktora zapalila, dlaczego, jaki score)
      #   Z = domkniecie wpisu
      # CELOWO BEZ `B` (naglowki zadania): siedzi w nich `Cookie`, a w nim
      # sessionid — czyli POSWIADCZENIE. Kto ma dostep do Loki, mogl by przejac
      # sesje zalogowanego uzytkownika. Potwierdzone na stagingu 2026-08-03.
      # User-Agent nie ginie: jest w access logu nginksa (format bpp_access),
      # do skorelowania po czasie i adresie IP.
      # UWAGA: to wylacza LOGOWANIE cial, nie ich INSPEKCJE —
      # MODSEC_REQ_BODY_ACCESS zostaje `on`, wiec ataki w POST sa nadal
      # wykrywane.
      MODSEC_AUDIT_LOG_PARTS: "${MODSEC_AUDIT_LOG_PARTS:-AHZ}"
      # Do audit logu trafia WYLACZNIE to, co zapalilo regule.
      #
      # `SecAuditEngine RelevantOnly` (domyslne w obrazie) loguje transakcje
      # z DWOCH NIEZALEZNYCH powodow, polaczonych OR:
      #   1) zapalila sie regula z akcja `auditlog`,
      #   2) status odpowiedzi pasuje do SecAuditLogRelevantStatus, a domyslne
      #      `^(?:5|4(?!04))` to KAZDE 4xx poza 404 i KAZDE 5xx.
      #
      # Powod (2) wpuszcza do audit logu ruch, ktorego WAF nawet nie dotknal —
      # wpis ma wtedy `"messages":[]`, czyli zero informacji o ataku:
      #   401 z `auth_request` na /grafana/, /dozzle/, /flower/, /netdata/
      #       (to ZAPROJEKTOWANA sciezka: `error_page 401 = @bpp_login`),
      #   429 z `limit_req` (rate limiting),
      #   502/503/504 gdy appserver lezy.
      # POTWIERDZONY PRZYPADEK (produkcja, 2026-08-05): wygasla sesja przy
      # otwartej karcie Grafany dala 9 wpisow 401 i panel "Najczesciej atakowane
      # sciezki" pokazywal fonty oraz moduly pluginow Grafany jako ataki.
      #
      # `^$` nie pasuje do zadnego kodu statusu (te sa zawsze niepuste), wiec
      # zostaje sam powod (1). Zmierzone na owasp/modsecurity-crs:nginx: przy
      # `^$` zwykle 502 nie zostawia wpisu, a zadanie z SQLi nadal zostawia wpis
      # z 4 regulami. Nic z dashboardu WAF-a nie ginie.
      #
      # Nic tez nie tracimy diagnostycznie: przy MODSEC_AUDIT_LOG_PARTS=AHZ
      # taki wpis niosl mniej niz linia access logu nginksa (format `bpp_access`,
      # tez zbierany przez Alloy), a bledy 5xx maja wlasny dashboard
      # "Error monitoring".
      #
      # `$$` to escape Compose'a na literalny `$` — bez niego interpolacja
      # zjadlaby koniec regexpa.
      MODSEC_AUDIT_LOG_RELEVANT_STATUS: "${MODSEC_AUDIT_LOG_RELEVANT_STATUS:-^$$}"
      # NIE ustawiamy NGINX_ENVSUBST_FILTER. Obraz CRS renderuje wlasne
      # szablony (75 zmiennych: WORKER_CONNECTIONS, LOGLEVEL, MODSEC_*, …)
      # i filtr "DJANGO_BPP_" zostawilby je dosownie -> nginx nie wstanie.
      # Konfiguracja BPP nie potrzebuje zadnych podstawien (patrz mount
      # default.conf.template nizej), wiec filtr stracil racje bytu.
    # Bez tego nginx (uid 101) nie ma prawa zapisu do wolumenu access logu ani
    # odczytu kluczy prywatnych i konczy sie [emerg] Permission denied —
    # patrz komentarz przy webserver-init.
    depends_on:
      webserver-init:
        condition: service_completed_successfully
    ports:
      - 80:80
      - 443:443
      - 443:443/udp    # HTTP/3 (QUIC)
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:80/healthz || exit 1"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - staticfiles:/var/www/html/staticroot
      - media:/mediaroot
      - ${BPP_CONFIGS_DIR}/ssl:/etc/ssl/private:ro
      # Let's Encrypt: certyfikaty zarzadzane przez kontener certbot (bind do
      # $BPP_CONFIGS_DIR/letsencrypt). Mountowane RW - nginx czyta certy oraz
      # usuwa sentinel .reload-needed po wykonaniu reload-a. Cert-files nie sa
      # nigdy modyfikowane przez nginx, tylko sentinel. Niezaleznie od
      # DJANGO_BPP_SSL_MODE - katalog moze byc pusty w trybie manual
      # (skrypt 30-render-bpp-vhosts.sh wybiera wlasciwa sciezke).
      - ${BPP_CONFIGS_DIR}/letsencrypt:/etc/letsencrypt
      # Webroot dla HTTP-01 challenge. Wspoldzielony z kontenerem certbot
      # (RW dla certbota, RO tutaj). Pusty katalog w trybie manual = 404
      # dla zapytan ACME, co jest ok bo i tak nikt prawdziwy tam nie chodzi.
      - acme-challenge:/var/www/certbot:ro
      # UWAGA na sciezke: `conf.d/` w srodku, a nie prosto w `templates/`.
      # Obraz CRS ustawia NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx (goly nginx ma
      # /etc/nginx/conf.d), a jego szablony odwzorowuja cale drzewo /etc/nginx.
      # Mount prosto w templates/ wyrenderowalby sie do /etc/nginx/default.conf,
      # ktorego `include /etc/nginx/conf.d/*.conf` NIE obejmuje — konfiguracja
      # BPP zniknelaby, a nginx wstalby BEZ BLEDU. Ta sciezka renderuje do
      # /etc/nginx/conf.d/default.conf i CELOWO nadpisuje szablon obrazu CRS
      # (jego wersja to generyczny reverse-proxy z `listen ... default_server`
      # i wlasna mapa $connection_upgrade — jedno i drugie kolidowaloby z BPP).
      # `modsecurity on;` siedzi w osobnym conf.d/modsecurity.conf, wiec to
      # nadpisanie NIE wylacza WAF-a.
      - ./defaults/webserver/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      # Wlasne naddefinicje ModSecurity (wykluczenia). setup.conf obrazu
      # includuje ten plik PRZED regulami CRS — patrz komentarz w samym pliku.
      - ./defaults/webserver/modsecurity-override.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      # log_format bpp_access (kontekst http) — laduje sie pierwszy (prefix 00-)
      # przed default.conf/vhost-*.conf, ktore go uzywaja.
      - ./defaults/webserver/00-log-format.conf:/etc/nginx/conf.d/00-log-format.conf:ro
      - ./defaults/webserver/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./defaults/webserver/_bpp-locations.conf:/etc/nginx/bpp-templates/_bpp-locations.conf:ro
      - ./defaults/webserver/vhost.conf.template:/etc/nginx/bpp-templates/vhost.conf.template:ro
      - ./defaults/webserver/30-render-bpp-vhosts.sh:/docker-entrypoint.d/30-render-bpp-vhosts.sh:ro
      # Let's Encrypt reload helper. NIE w /docker-entrypoint.d/ (uruchomilby
      # sie przy starcie kontenera) - tylko jako exec na zadanie z Ofelia.
      - ./scripts/letsencrypt-reload.sh:/usr/local/bin/letsencrypt-reload.sh:ro
      # Rotacja access logu czytanego przez netdata web_log (Ofelia job-exec).
      - ./scripts/nginx-access-log-rotate.sh:/usr/local/bin/nginx-access-log-rotate.sh:ro
      - ./defaults/webserver/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      # Access log dla kolektora netdata web_log. Osobny katalog (NIE
      # /var/log/nginx) zeby nie przeslonic symlinkow access.log->stdout /
      # error.log->stderr z obrazu nginx. Wspoldzielony RO z kontenerem netdata.
      - nginx_access_log:/var/log/nginx-shared
    deploy:
      resources:
        limits:
          # Obserwowane idle ~32 MiB, ale proxy_buffers 16x16k = 256 KB/connection
          # przy buforowaniu HTML-a z Django. Przy 500 concurrent requests to realnie
          # +110 MB RAM. 256m daje headroom pod burst + HTTP/3 QUIC + duze uploady.
          memory: ${WEBSERVER_MEM_LIMIT:-256m}
          cpus: "${WEBSERVER_CPU_LIMIT:-2.0}"
    labels:
      ofelia.enabled: "true"
      # Po renew certbota (job-run w docker-compose.application.yml) pojawi sie
      # sentinel /etc/letsencrypt/.reload-needed. Ten job-exec wykrywa go
      # i robi graceful reload nginx-a, zeby podniesc nowy cert. Bez sentinela
      # nginx serwuje stary cert do najblizszej restartu.
      # 5 minut po job-run renew (bezpieczny margines na wystawienie certu).
      ofelia.job-exec.letsencrypt_reload.schedule: "0 5 4 * * *"
      ofelia.job-exec.letsencrypt_reload.command: "/usr/local/bin/letsencrypt-reload.sh"
      # Codzienna rotacja access logu czytanego przez netdata web_log (04:10 —
      # po reloadzie LE 04:05, zeby nie kolidowac). `nginx -s reopen` odtwarza
      # plik; netdata wykrywa podmiane inode i czyta dalej.
      ofelia.job-exec.nginx_access_log_rotate.schedule: "0 10 4 * * *"
      ofelia.job-exec.nginx_access_log_rotate.command: "/usr/local/bin/nginx-access-log-rotate.sh"

  redis:
    image: redis:8.6.2
    restart: always
    logging: *default-logging
    # --maxmemory + allkeys-lru: Redis sam ewiktuje klucze gdy zbliza sie
    # do wlasnego limitu, zamiast czekac az Docker zabije caly kontener.
    # Wewnetrzny limit musi byc mniejszy niz zewnetrzny, zeby eviction
    # mial szanse zadzialac przed hard-OOM-kill-em.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-200mb}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 3s
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-1g}
          cpus: "${REDIS_CPU_LIMIT:-0.5}"

volumes:
  redis:
  # Webroot dla HTTP-01 challenge Let's Encrypt. Wspoldzielony miedzy
  # webserverem (czyta+rm sentinela) a kontenerem certbot z application.yml
  # (zapisuje pliki challenge przez --webroot). Ephemeral - tresc challenge
  # zyje sekundami, nic wartosciowego sie nie kumuluje.
  acme-challenge:
  # Access log nginx (format bpp_access) czytany przez kolektor netdata
  # web_log. Pisany RW przez webserver, montowany RO do netdaty
  # (docker-compose.monitoring.yml). Rotowany codziennie przez Ofelia —
  # max 2 generacje (.log + .log.1), wiec nie rosnie w nieskonczonosc.
  nginx_access_log:
