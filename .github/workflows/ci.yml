name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testy Makefile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest ma dzialajacy Docker daemon — wymuszamy pelne pokrycie:
      # brak dockera/curla to tu FAIL, nie cichy SKIP (macOS/Windows joby ponizej
      # nie maja linuksowego daemona, wiec tam skipy srodowiskowe sa OK).
      - name: Uruchom testy
        env:
          BPP_REQUIRE_DOCKER: "1"
        run: ./tests/test_makefile.sh

      # Testy na mockach (bez dockera i sieci): petla auto-update oraz sesja
      # wdrozenia z ostrzezeniem. Obie dotykaja tej samej sciezki `make run`,
      # wiec regresja w jednej lubi wychodzic w drugiej.
      - name: Auto-update (mocki)
        run: ./scripts/test-autoupdate.sh

      - name: Wdrozenie z ostrzezeniem (mocki)
        run: ./scripts/test-deploy-with-warning.sh

      # Normalizacja sciezki katalogu konfiguracyjnego (Windows symulowany
      # atrapami cygpath/uname w PATH) - regresja jest wiec lapana tutaj, a
      # nie dopiero w wolniejszym jobie test-windows.
      - name: Sciezka katalogu konfiguracyjnego (mocki)
        run: ./scripts/test-config-path.sh

      # Render datasource'ow Grafany bez `envsubst` w PATH - czyli w warunkach
      # Windows, ktory nie ma gettexta.
      - name: Render datasources.yaml bez gettexta
        run: ./scripts/test-grafana-datasources.sh

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Inline pre-commit/action@v3.0.1: ten action wewnatrz uzywa
      # actions/cache@v4 (Node 20, deprecated), a v3.0.1 to ostatni
      # release pre-commit/action - nie ma wersji na Node 24.
      # Inline-ujemy logike z actions/cache@v5 zeby usunac warning.
      - name: Cache pre-commit envs
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          python -m pip freeze --local
          pre-commit run --all-files --show-diff-on-failure --color=always

  # Testy stawiajace prawdziwe kontenery. Wymagaja linuksowego daemona Dockera,
  # wiec TYLKO ubuntu — runnery macOS i Windows go nie maja.
  #
  # Do 2026-08-04 zaden z tych dwoch skryptow nie byl uruchamiany w CI: workflow
  # wolal wylacznie tests/test_makefile.sh. `make test-waf` istnial od migracji na
  # WAF i przechodzil lokalnie, ale nikt go nie egzekwowal przy PR-ach.
  test-runtime:
    name: Testy runtime (WAF + pipeline logow)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Stawia obraz CRS z prawdziwa konfiguracja z defaults/webserver/ i strzela
      # prawdziwymi payloadami sqlmap. Sprawdza takze, ze nginx (uid 101) potrafi
      # pisac do wolumenu NAZWANEGO — czyli tego typu storage'u, ktory ma produkcja.
      - name: WAF (ModSecurity + OWASP CRS)
        run: ./scripts/test-waf.sh

      # Przepuszcza prawdziwy defaults/alloy/config.alloy przez prawdziwe linie
      # logu i sprawdza detected_level oraz pola modsec_*.
      - name: Pipeline logow Alloy
        run: ./scripts/test-alloy.sh

  test-windows:
    name: Testy Makefile (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Instalacja GNU Make
        run: choco install make -y

      - name: Uruchom testy w Git Bash
        shell: bash
        run: ./tests/test_makefile.sh

  # Identyfikatory pakietow winget uzyte w instrukcji dla Windows. Runner Windows
  # NIE weryfikuje samej instalacji: runnery GitHuba nie maja wirtualizacji
  # zagniezdzonej (brak WSL2 i Docker Desktopa), a winget jest tam praktycznie
  # nieuzywalny (konto uslugowe bez sesji interaktywnej) — dlatego job
  # test-windows instaluje make przez choco, mimo ze dokumentacja mowi `winget`.
  # Ten job domyka przynajmniej to, co domknac sie da: czy ID pakietow nadal
  # istnieja w microsoft/winget-pkgs. Leci na ubuntu, bo to zwykly HTTP.
  winget-ids:
    name: Identyfikatory pakietow winget (dokumentacja Windows)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Sprawdz ID pakietow w microsoft/winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/test-winget-ids.sh

  test-macos:
    name: Testy Makefile (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Uruchom testy
        run: ./tests/test_makefile.sh

  yaml-lint:
    name: Walidacja docker-compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Walidacja składni docker-compose
        run: |
          for f in docker-compose*.yml; do
            echo "Checking $f..."
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done
          echo "All docker-compose files valid."
