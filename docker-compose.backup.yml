x-logging: &default-logging
  driver: "local"
  options:
    max-size: "${LOG_MAX_SIZE:-150m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:

  # Zunifikowany backup worker - obsluguje CALY cykl backupu:
  #   1. pg_dump bazy -> /backup/db-backup-TS.tar.gz
  #   2. tar volumenu media -> /backup/media-backup-TS.tar.gz
  #   3. lokalna rotacja (KEEP_LAST)
  #   4. rclone copy -> zdalny serwer (JEDEN katalog na miesiac: YYYY-MM/)
#      CRITICAL: copy, nigdy sync - patrz scripts/lib-rclone.sh
#   4b. retencja zdalna (DJANGO_BPP_RCLONE_KEEP_MONTHS, domyslnie 12 mies.)
  #   5. notyfikacja do Rollbara (level=info/error)
  #
  # Wszystko w jednym kontenerze, wolany raz dziennie przez Ofelie.
  # Obraz: domyslnie TEN SAM pelny obraz co dbserver (postgres:<MAJOR.MINOR>,
  # Debian) -> backup-runner wspoldzieli z nim 100% warstw, czyli ~0 MB netto
  # na dysku (alpine NIE dzieli warstw z Debianem - byly osobne +~350 MB).
  # pg_dump trafia dokladnie w wersje serwera. rclone, curl, jq doinstalowane
  # w runtime (apt-get na Debianie / apk na alpine - patrz command nizej).
  # CRITICAL: ca-certificates musi byc na liscie instalowanych pakietow.
  # Oficjalny obraz postgres (Debian) instaluje ca-certificates tylko na czas
  # sciagniecia gosu i PURGE'uje je przed koncem builda - final image nie ma
  # ZADNEGO magazynu CA. Debianowy rclone zalezy wylacznie od libc6 (nie ma
  # ca-certificates nawet w Recommends), a my i tak instalujemy
  # z --no-install-recommends. Bez tego pakietu KAZDE polaczenie HTTPS
  # z kontenera pada na "x509: certificate signed by unknown authority":
  # rclone nie odswiezy tokenu OAuth (backup zdalny = exit 3), a curl nie
  # dowiezie notyfikacji do Rollbara (http=000), wiec o awarii nikt sie nie
  # dowie. Dopoki backup-runner stal na postgres:*-alpine (do f676fba,
  # 2026-06-18) problemu nie bylo - alpine ma bundle CA w bazowym obrazie.
  # Tryb external: dbserver to lekki sentinel postgres:<major>-alpine, wiec
  # init-configs/ensure-config-files ustawiaja BPP_BACKUP_PG_IMAGE=
  # postgres:<major>-alpine, by backup-runner wspoldzielil warstwy z sentinelem
  # (a nie sciagal osobnego Debiana).
  backup-runner:
    # BPP_BACKUP_PG_IMAGE: override obrazu (ustawiany TYLKO w trybie external).
    # Nieustawiony -> ten sam tag co dbserver: DJANGO_BPP_POSTGRESQL_VERSION
    # (MAJOR.MINOR) z dwuwarstwowym fallbackiem (stara nazwa DBSERVER_PG_VERSION,
    # default 16.13) - identyczne wyrazenie jak w docker-compose.database.yml,
    # wiec tag rozwiazuje sie do tego samego obrazu (realne wspoldzielenie warstw).
    image: ${BPP_BACKUP_PG_IMAGE:-postgres:${DJANGO_BPP_POSTGRESQL_VERSION:-${DJANGO_BPP_DBSERVER_PG_VERSION:-16.13}}}
    restart: always
    logging: *default-logging
    env_file: ${BPP_CONFIGS_DIR}/.env
    environment:
      PGPASSWORD: ${DJANGO_BPP_DB_PASSWORD}
    volumes:
      - ${DJANGO_BPP_HOST_BACKUP_DIR}:/backup
      - media:/mediaroot:ro
      # CRITICAL: read-WRITE, nigdy :ro. rclone tego katalogu nie tylko czyta.
      # 1) `rclone config` (czyli `make rclone-config`) zapisuje rclone.conf
      #    przez temp-plik + rename W TYM katalogu. Przy :ro kazda odpowiedz
      #    w kreatorze konczy sie "Failed to save config after 10 tries: ...
      #    read-only file system", ale kreator brnie dalej - operator
      #    przeklikuje calosc i dopiero potem odkrywa, ze konfiguracja nie
      #    powstala. Mount byl :ro od pierwszego commita (6514c1a), wiec
      #    udokumentowany `make rclone-config` nie zadzialal ani razu.
      # 2) Po kazdym wygasnieciu access-tokenu OAuth rclone zapisuje tu
      #    odswiezony token - dokumentacja rclone (opcja --config) stawia to
      #    wprost: "When token-based authentication are used, the
      #    configuration file must be writable, because rclone needs to
      #    update the tokens inside it". Tam, gdzie refresh-token jest
      #    JEDNORAZOWY (Box: "Each refresh_token is valid for one use in
      #    60 days"), brak zapisu rozwala autoryzacje NA TRWALE - pierwsze
      #    odswiezenie zuzywa stary token, nowy nie ma gdzie wyladowac.
      # :ro nic tu nie chronilo: to ten sam kontener, ktory ma rw na /backup
      # i dostaje PGPASSWORD.
      - ${BPP_CONFIGS_DIR}/rclone:/config/rclone
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    # Ten sam blok dziala na OBU obrazach: Debian (default, apt-get) i alpine
    # (tryb external, apk). Bash i coreutils sa juz w Debianie - doinstalowujemy
    # tylko rclone/curl/jq; na alpine dobieramy tez bash i coreutils.
    command:
      - |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache ca-certificates rclone curl jq bash coreutils >/dev/null 2>&1 || exit 1
        else
          apt-get update >/dev/null 2>&1 \
            && apt-get install -y --no-install-recommends ca-certificates rclone curl jq >/dev/null 2>&1 || exit 1
        fi
        exec sleep infinity
    healthcheck:
      # Magazyn CA jest sprawdzany na rowni z binarkami: jego brak nie objawia
      # sie niczym, dopoki o 2:30 nie padnie wysylka na zdalny. Sciezka jest ta
      # sama na Debianie (pakiet ca-certificates) i na alpine
      # (ca-certificates-bundle).
      test: ["CMD-SHELL", "command -v rclone >/dev/null && command -v curl >/dev/null && command -v pg_dump >/dev/null && command -v jq >/dev/null && [ -s /etc/ssl/certs/ca-certificates.crt ]"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      ofelia.enabled: "true"
      # Codzienny cykl backupu o 2:30 - po denorm_rebuild (22:00) i przed
      # poranna prace biznesowa.
      ofelia.job-exec.backup_cycle.schedule: "0 30 2 * * *"
      ofelia.job-exec.backup_cycle.command: "/scripts/backup-cycle.sh"

  # Rclone jako ZADEKLAROWANY serwis, a nie `docker run --rm` ze skryptu.
  # Powod nie jest estetyczny: (1) compose ciagnie obrazy tylko zadeklarowanych
  # serwisow, wiec obraz uzyty w `docker run` byl by pobierany dopiero o 2:30;
  # (2) `make up` konczy sie `docker system prune -af`, ktory usuwa obrazy bez
  # skojarzonego kontenera - a `--rm` zadnego nie zostawia, wiec obraz znikalby
  # przy KAZDYM `make up`; (3) mounty deklaruje compose, wiec w skryptach nie ma
  # ani jednej sciezki hosta (`docker run -v /backup:...` z wnetrza kontenera
  # zamontowalby pusta sciezke hosta - mount by sie udal, dane nie).
  rclone:
    image: ${BPP_RCLONE_IMAGE:-rclone/rclone:1.71.0}
    restart: always
    logging: *default-logging
    env_file: ${BPP_CONFIGS_DIR}/.env
    volumes:
      # RW, nigdy :ro - rclone zapisuje tu odswiezony token OAuth.
      - ${BPP_CONFIGS_DIR}/rclone:/config/rclone
      - ${DJANGO_BPP_HOST_BACKUP_DIR}:/backup:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "rclone version >/dev/null && [ -s /etc/ssl/certs/ca-certificates.crt ]"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
