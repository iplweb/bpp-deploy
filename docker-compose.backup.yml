x-logging: &default-logging
  driver: "local"
  options:
    max-size: "${LOG_MAX_SIZE:-150m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:

  # Orkiestrator cyklu backupu - obraz docker:cli, ktory SAM NIE MA pg_dump,
  # rclone, curl ani jq. Zamiast doinstalowywac je w runtime (jak do tej
  # wersji), ciezkie kroki wykonuje przez `docker exec` w kontenerach, ktore
  # i tak istnieja i maja wlasciwe narzedzie:
  #   1. pg_dump              -> docker exec w serwisie dbserver (haslo
  #                              czytane TAM, z DJANGO_BPP_DB_PASSWORD -
  #                              nie przechodzi przez -e)
  #   2. tar dumpu i mediow   -> lokalnie (busybox tar; /backup i media
  #                              zamontowane tez tutaj)
  #   3. lokalna rotacja (KEEP_LAST)
  #   4. rclone copy/lsf/purge -> docker exec w serwisie rclone (patrz shim
  #                              `rclone()` w scripts/backup-cycle.sh)
  #   5. notyfikacja do Rollbara (level=info/error)
  #
  # Kontenery adresowane po labelach compose (scripts/lib-container.sh),
  # NIGDY po nazwie - compose generuje `<projekt>-<usluga>-<n>`, a ten plik
  # nie ustawia `container_name:`.
  #
  # UWAGA na przyszlosc: docker:cli dziala jako uid 0 i dlatego otwiera
  # /var/run/docker.sock niezaleznie od grupy - dodanie `user:` do tego
  # serwisu to zepsuje (socket przestanie byc czytelny).
  #
  # Mount configu rclone jest :ro, chociaz ten serwis rclone'a nie uruchamia:
  # scripts/backup-cycle.sh sprawdza `[ ! -f "$RCLONE_CONFIG" ]` PRZED
  # wysylka (krok 4) - bez tego mountu warunek bylby prawdziwy ZAWSZE i cykl
  # padalby co noc na `fail rclone-config-missing 3`. Zapis do configu
  # (kreator, odswiezanie tokenu OAuth) robi wylacznie serwis `rclone` ponizej,
  # ktory ma go RW.
  backup-runner:
    # BPP_ORCHESTRATOR_IMAGE: override obrazu orkiestratora (np. do testu pod
    # innym tagiem docker:cli). Nieustawiony -> docker:28-cli.
    image: ${BPP_ORCHESTRATOR_IMAGE:-docker:28-cli}
    restart: always
    logging: *default-logging
    # KRYTYCZNE, nie kosmetyka: bez tego cykl czyta same defaulty ze skryptu.
    # Operator z udokumentowanym wylacznikiem `DJANGO_BPP_RCLONE_KEEP_MONTHS=`
    # w .env dostalby po tej zmianie WLACZONE kasowanie zdalnych kopii.
    env_file: ${BPP_CONFIGS_DIR}/.env
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      # Do `docker exec` w dbserverze/rclonie - jedyny sposob, w jaki ten
      # kontener cokolwiek "robi". Patrz uwaga o `user:` wyzej.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DJANGO_BPP_HOST_BACKUP_DIR}:/backup
      - media:/mediaroot:ro
      # :ro - patrz komentarz nad serwisem. Zapis robi wylacznie serwis `rclone`.
      - ${BPP_CONFIGS_DIR}/rclone:/config/rclone:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec sleep infinity"]
    healthcheck:
      # Sonduje to, co realnie moze pasc: dostep do socketu i powloke z
      # pipefail (niekompatybilny BPP_ORCHESTRATOR_IMAGE ma byc unhealthy
      # przy `make up`, a nie odkryty o 2:30). Binarek (pg_dump/rclone/curl/jq)
      # nie sprawdzamy - ten kontener ich nie ma, wykonuje je przez
      # `docker exec` gdzie indziej.
      test: ["CMD-SHELL", "docker version --format '{{.Server.Version}}' >/dev/null && (set -o pipefail)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      ofelia.enabled: "true"
      # Codzienny cykl backupu o 2:30 - po denorm_rebuild (22:00) i przed
      # poranna prace biznesowa.
      ofelia.job-exec.backup_cycle.schedule: "0 30 2 * * *"
      ofelia.job-exec.backup_cycle.command: "/scripts/backup-cycle.sh"

  # Rclone jako ZADEKLAROWANY serwis, a nie `docker run --rm` ze skryptu.
  # Powod nie jest estetyczny: (1) compose ciagnie obrazy tylko zadeklarowanych
  # serwisow, wiec obraz uzyty w `docker run` byl by pobierany dopiero o 2:30;
  # (2) `make up` konczy sie `docker system prune -af`, ktory usuwa obrazy bez
  # skojarzonego kontenera - a `--rm` zadnego nie zostawia, wiec obraz znikalby
  # przy KAZDYM `make up`; (3) mounty deklaruje compose, wiec w skryptach nie ma
  # ani jednej sciezki hosta (`docker run -v /backup:...` z wnetrza kontenera
  # zamontowalby pusta sciezke hosta - mount by sie udal, dane nie).
  # Celowo BEZ limitu pamieci (drugi wyjatek obok backup-runnera, patrz
  # docs/konfiguracja/limity-zasobow.md): OOM-kill w trakcie `rclone copy`
  # zamienia wolny backup w brak backupu, a proces i tak dziala tylko w oknie
  # cyklu nocnego.
  rclone:
    image: ${BPP_RCLONE_IMAGE:-rclone/rclone:1.71.0}
    restart: always
    logging: *default-logging
    env_file: ${BPP_CONFIGS_DIR}/.env
    volumes:
      # RW, nigdy :ro - rclone zapisuje tu odswiezony token OAuth.
      - ${BPP_CONFIGS_DIR}/rclone:/config/rclone
      - ${DJANGO_BPP_HOST_BACKUP_DIR}:/backup:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "rclone version >/dev/null && [ -s /etc/ssl/certs/ca-certificates.crt ]"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
