# ============================================================================
# WSPOLNE WNETRZE GLOWNEGO HTTPS SERVER BLOKU
# ============================================================================
#
# Plik includowany przez kazdy vhost-<host>.conf wygenerowany z
# vhost.conf.template. Trzyma wszystko co dzielone miedzy hostami: location
# bloki, error_pages, gzip, security blocks, root.
#
# Tutaj NIE moze byc: listen, server_name, ssl_certificate*, ssl_session_timeout,
# add_header Alt-Svc, client_max_body_size — to siedzi w vhost.conf.template.
# ============================================================================

include /etc/nginx/conf.d/security-headers.conf;

# ============================================================================
# ERROR PAGES CONFIGURATION
# ============================================================================
# Custom error pages for better user experience
#
# error_page 500 jest definiowany PER-HOST w vhost.conf.template (potrzebuje
# ${VHOST_NAME}, którego envsubst NIE podstawia w tym pliku — jest on
# includowany dosłownie). Multi-hosted: każda domena dostaje własną stronę
# 500 z brandingiem swojej uczelni, z fallbackiem na generyczny /static/500.html.
error_page 502 503 504 /maintenance.html;
location = /maintenance.html {
    root /usr/share/nginx/html;
    internal;
}

# ============================================================================
# ODRZUCANIE ZABLOKOWANYCH ZADAN BEZ ODPOWIEDZI (HTTP 444)
# ============================================================================
# 444 to niestandardowy kod nginksa: zamknij polaczenie NIE wysylajac zadnej
# odpowiedzi. Skaner nie dostaje ani kodu, ani strony bledu, ani naglowkow —
# czyli zadnego sygnalu zwrotnego, po ktorym moglby zgadywac, co go zatrzymalo.
#
# CO TU WPADA: wylacznie 403 wygenerowane przez SAMEGO nginksa —
#   - blokada ModSecurity/CRS (regula 949110 konczy sie `deny`, domyslnie 403),
#   - nasze wlasne `deny all` (pliki ukryte, kopie zapasowe, /metrics,
#     wykonywalne w /media/).
#
# CZEGO TU NIE MA: 403 zwrocone przez DJANGO (PermissionDenied). `error_page`
# przetwarza odpowiedzi upstreamu tylko przy `proxy_intercept_errors on`, a my
# tego CELOWO nie wlaczamy — dzieki temu uzytkownik bez uprawnien dalej widzi
# normalna strone "brak dostepu", a nie zerwane polaczenie.
#
# UWAGA PRZY ZMIANACH: wlaczenie gdziekolwiek `proxy_intercept_errors on`
# sprawi, ze 403 z Django zacznie tu wpadac i legalni uzytkownicy zaczna
# dostawac zerwane polaczenia zamiast komunikatu. Nie wlaczaj tego.
error_page 403 = @odrzuc_bez_odpowiedzi;
location @odrzuc_bez_odpowiedzi {
    return 444;
}

# ============================================================================
# MAIN APPLICATION ROUTING
# ============================================================================
# Try to serve static files directly, otherwise proxy to Django app.
#
# Rate limiting (limit_req) per-tier. Strefy zdefiniowane w kontekscie http w
# default.conf.template; tutaj (kontekst server) tylko ich uzywamy. Status 429
# ustawiony globalnie (limit_req_status w default.conf.template) — NIE domyslne
# 503, ktore error_page 502 503 504 zamienialoby na strone "konserwacja".
#
# Liczy sie RAZ: limit_req dziala w fazie preaccess na locationie pasujacym do
# URI (/api/, /admin/ albo /); try_files -> @proxy_to_app to internal redirect
# do named locationa BEZ limitu, wiec nie dubluje zliczania. /static/, /media/,
# /healthz i panele za auth (grafana/dozzle/flower/netdata) maja wlasne locationy
# bez limit_req -> celowo nielimitowane (tanie/zaufane).

# /api/ (w tym /api/v1/) — hojny per-IP (anty-abuse: jeden IP nie zzera wiecej
# niz ~2x zmierzony legalny peak). Pojemnosci CALEGO hosta pilnuja workery
# appservera + limity CPU/RAM Dockera (make configure-resources), nie ten req/s.
location /api/ {
    limit_req zone=bpp_api burst=60 nodelay;
    try_files $uri @proxy_to_app;
}

# /admin/ — hojnie; realnego edytora (zmierzony peak ~23 r/s) nie tyka, a jest
# siatka na brute-force/skanery walacace setki req/s.
location /admin/ {
    limit_req zone=bpp_admin burst=50 nodelay;
    try_files $uri @proxy_to_app;
}

# Cala reszta publicznego serwisu.
location / {
    limit_req zone=bpp_general burst=100 nodelay;
    try_files $uri @proxy_to_app;
}

# Metrics endpoint - BLOCKED from everywhere
# Prevents external access to Prometheus metrics
location = /metrics {
    deny all;
    access_log off;
    return 403;
}

# Health check endpoint for Docker/load balancer
#
# `default_type`, a NIE `add_header Content-Type`: add_header DOKLADA naglowek
# zamiast go podmieniac, wiec odpowiedz wychodzila z DWOMA Content-Type naraz
# (application/octet-stream z globalnego default_type + text/plain z
# add_header). Widac to bylo goly okiem w audit logu ModSecurity. `return`
# z literalnym body bierze typ wlasnie z default_type, wiec ustawienie go
# zalatwia sprawe jednym, poprawnym naglowkiem.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
}

# ============================================================================
# PROXY CONFIGURATION
# ============================================================================
# Proxy configuration for Django application with WebSocket support
location @proxy_to_app {
    resolver 127.0.0.11 valid=30s;
    set $upstream_appserver appserver;
    proxy_pass http://$upstream_appserver:8000;

    # HTTP/1.1 and WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Forward client information to Django
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Scheme $scheme;
    proxy_set_header Host $host;
    proxy_set_header Referer $http_referer;

    # Timeouts for long-running operations (reports, imports, etc.)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Buffer settings for optimal performance.
    # 16 x 16k = 256 KB mieści typowe strony Django BPP (listy publikacji,
    # szczegóły autora — zwykle 50-200 KB HTML) w RAM. Za małe bufory
    # powodują spill response'a do /var/cache/nginx (proxy_temp_path),
    # co zabija throughput na dużych listach.
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;

    proxy_redirect off;
}

# ============================================================================
# EXTERNAL SERVICE AUTHENTICATION
# ============================================================================
# Auth subrequest to lightweight auth server - validates superuser session
# Uses authserver (port 8001) which starts quickly, independent of main app
location = /_bpp_superuser_auth {
    internal;
    resolver 127.0.0.11 valid=30s;
    set $upstream_authserver authserver;
    proxy_pass http://$upstream_authserver:8001/__external_auth/is_superuser/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    # Forward headers required for Django session authentication
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Critical: forward session cookie for authentication
    proxy_set_header Cookie $http_cookie;
}

# Login redirect handler for unauthorized access
# Redirects to authserver login (not main app) for faster response
# Uses $host (NOT $http_host): pod HTTP/3 (QUIC) nie ma naglowka Host:, jest
# pseudo-naglowek :authority -> $http_host jest PUSTY i redirect wychodzi jako
# https:///__external_auth/login/?next=https:///... (bez domeny). Firefox
# przelacza sie na h3 po Alt-Svc i trafial na ten bug; Safari (h2) nie. $host
# bierze wartosc z :authority/Host/server_name, wiec dziala w h1/h2/h3.
location @bpp_login {
    return 302 $scheme://$host/__external_auth/login/?next=$scheme://$host$request_uri;
}

# Route emergency auth endpoints to authserver
location /__external_auth/ {
    resolver 127.0.0.11 valid=30s;
    set $upstream_authserver_ext authserver;
    proxy_pass http://$upstream_authserver_ext:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Required for Django CSRF validation on HTTPS
    proxy_set_header Referer $http_referer;
}

# ============================================================================
# GRAFANA PROXY (port 3000)
# ============================================================================
# Uses variables for hostname to defer DNS resolution to request time.
# If grafana service is not running, requests will get 502 instead of
# nginx failing to start.
location /grafana/ {
    # Use Docker's internal DNS resolver (127.0.0.11)
    resolver 127.0.0.11 valid=30s;
    set $upstream_grafana grafana;

    # Require superuser authentication from BPP
    auth_request /_bpp_superuser_auth;

    # Get user info from BPP response headers
    auth_request_set $bpp_user  $upstream_http_x_webauth_user;
    auth_request_set $bpp_email $upstream_http_x_webauth_email;
    auth_request_set $bpp_name  $upstream_http_x_webauth_name;

    # Override client headers with authenticated values
    proxy_set_header X-WEBAUTH-USER  $bpp_user;
    proxy_set_header X-WEBAUTH-EMAIL $bpp_email;
    proxy_set_header X-WEBAUTH-NAME  $bpp_name;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # WebSocket support (Grafana Live uses WS at /grafana/api/live/ws).
    # Bez tego handshake jest odrzucany -> NS_ERROR_WEBSOCKET_CONNECTION_REFUSED.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Rewrite /grafana/ to / for Grafana
    proxy_pass http://$upstream_grafana:3000;

    # Redirect to BPP login on auth failure
    error_page 401 = @bpp_login;
}

# ============================================================================
# DOZZLE PROXY (port 8080)
# ============================================================================
# Uses variables for hostname to defer DNS resolution to request time.
# If dozzle service is not running, requests will get 502 instead of
# nginx failing to start.
# Config per https://dozzle.dev/guide/changing-base
location ^~ /dozzle/ {
    # Use Docker's internal DNS resolver (127.0.0.11)
    resolver 127.0.0.11 valid=30s;
    set $upstream_dozzle dozzle;

    # Require superuser authentication from BPP
    auth_request /_bpp_superuser_auth;

    # Get user info from BPP response headers
    auth_request_set $bpp_user  $upstream_http_x_webauth_user;
    auth_request_set $bpp_email $upstream_http_x_webauth_email;
    auth_request_set $bpp_name  $upstream_http_x_webauth_name;

    # Override client headers with authenticated values
    proxy_set_header X-WEBAUTH-USER  $bpp_user;
    proxy_set_header X-WEBAUTH-EMAIL $bpp_email;
    proxy_set_header X-WEBAUTH-NAME  $bpp_name;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Dozzle-specific settings for real-time log streaming
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Pass to Dozzle (DOZZLE_BASE=/dozzle/ handles path rewriting)
    proxy_pass http://$upstream_dozzle:8080;

    # Redirect to BPP login on auth failure
    error_page 401 = @bpp_login;
}

# ============================================================================
# FLOWER PROXY (port 5555)
# ============================================================================
# Celery task monitoring dashboard
# Uses variables for hostname to defer DNS resolution to request time.
location /flower/ {
    # Use Docker's internal DNS resolver (127.0.0.11)
    resolver 127.0.0.11 valid=30s;
    set $upstream_flower flower;

    # Require superuser authentication from BPP
    auth_request /_bpp_superuser_auth;

    # Get user info from BPP response headers
    auth_request_set $bpp_user  $upstream_http_x_webauth_user;
    auth_request_set $bpp_email $upstream_http_x_webauth_email;
    auth_request_set $bpp_name  $upstream_http_x_webauth_name;

    # Override client headers with authenticated values
    proxy_set_header X-WEBAUTH-USER  $bpp_user;
    proxy_set_header X-WEBAUTH-EMAIL $bpp_email;
    proxy_set_header X-WEBAUTH-NAME  $bpp_name;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass to Flower (FLOWER_URL_PREFIX=/flower handles path)
    proxy_pass http://$upstream_flower:5555;

    # Redirect to BPP login on auth failure
    error_page 401 = @bpp_login;
}

# ============================================================================
# NETDATA PROXY (port 19999)
# ============================================================================
# Sub-path reverse proxy (https://host/netdata/...) - asset URLs muszą
# zachowac prefix /netdata/ inaczej browser strzeli do roota i trafi
# na Django/404. Regex location z named capture przekazuje sciezke za
# /netdata/ z zachowanym prefiksem + X-Forwarded-Url dla autodetekcji.
location ~ ^/netdata/(?<ndpath>.*) {
    # Use Docker's internal DNS resolver (127.0.0.11)
    resolver 127.0.0.11 valid=30s;
    set $upstream_netdata netdata;

    # Require superuser authentication from BPP
    auth_request /_bpp_superuser_auth;

    # Get user info from BPP response headers
    auth_request_set $bpp_user  $upstream_http_x_webauth_user;
    auth_request_set $bpp_email $upstream_http_x_webauth_email;
    auth_request_set $bpp_name  $upstream_http_x_webauth_name;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # Powiedz Netdacie pelny URL jaki widzi browser - autodetekcja prefiksu
    # przy generowaniu URL-i assetow.
    proxy_set_header X-Forwarded-Url $scheme://$host$request_uri;
    proxy_set_header X-Forwarded-Host $host;

    # WebSocket support (Netdata uses WS for live charts)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Disable buffering for live data streams
    proxy_buffering off;

    # Przekaz ND-relative path do agenta - $ndpath to wszystko po /netdata/
    proxy_pass http://$upstream_netdata:19999/$ndpath$is_args$args;

    # Redirect to BPP login on auth failure
    error_page 401 = @bpp_login;
}

# Redirect /netdata -> /netdata/ (browser wpisuje URL bez slasha)
location = /netdata {
    return 301 /netdata/;
}


# ============================================================================
# SECURITY BLOCKS
# ============================================================================

# WYJATEK PRZED blokada plikow ukrytych: /.well-known/ (RFC 8615).
# To standardowa przestrzen metadanych serwisu, a nie "plik ukryty" — leza tam
# m.in. metadane serwera autoryzacji OAuth (RFC 8414,
# /.well-known/oauth-authorization-server), po ktore siega kazdy klient MCP
# przed logowaniem, a takze security.txt.
#
# UWAGA na kolejnosc matchowania location w nginksie: regex `~` ma
# pierwszenstwo przed zwyklym prefiksem, wiec blok `location ~ /\.` ponizej
# przechwytywal ZADANIA do /.well-known/ i zwracal 403 (discovery OAuth padalo,
# `bpp-mcp login` nie mial skad wziac authorization_endpoint). Modyfikator `^~`
# stawia ten prefiks PONAD regexami i przywraca poprawne zachowanie.
# Django odpowiada 404 na nieznane sciezki .well-known, wiec nic sie nie
# odslania; .git/.env dalej lapie regex ponizej.
location ^~ /.well-known/ {
    limit_req zone=bpp_general burst=100 nodelay;
    try_files $uri @proxy_to_app;
}

# Block access to hidden files and directories
# Prevents access to .git, .env, and other hidden files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Block access to backup and source files
# Prevents access to configuration files, backups, and source code
location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|git|gitignore|dockerignore|env)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# ============================================================================
# ROZSZERZENIA WYKONYWALNE — 444 NA CALYM SERWISIE
# ============================================================================
# BPP nie serwuje ANI JEDNEGO pliku z rozszerzeniem wykonywalnym. To nie jest
# lista cudzych podatnosci (taka gnije), tylko NEGATYWNA DEFINICJA WLASNEJ
# przestrzeni URL — a ta sie nie starzeje.
#
# DLACZEGO `php[0-9]*`, A NIE `php|php3|php5|php7`: 05.08.2026 przejrzano 72 h
# access logow produkcji. Realne sondy mialy postac `.php73`, `.php56`, `.php7`
# i `.PhP7` — czyli wyliczenie wariantow, ktore wygladalo rozsadnie, przepuscilo
# 3 z 5 trafien. Skanery celowo sypia wersjonowanymi rozszerzeniami, bo serwery
# z PHP-FPM czesto wykonuja wszystko, co pasuje do `\.php`. Klasa znakow lapie
# takze to, czego jeszcze nie wymyslono. `~*` zalatwia wielkosc liter (`.PhP7`).
#
# TA WARSTWA JEST DRUGA, NIE PIERWSZA: te same rozszerzenia blokuje juz
# MaliciousRequestBlockingMiddleware w obrazie BPP (BLOCKED_EXTENSIONS w
# bpp/src/bpp/middleware.py, rowniez przez 444). Roznica jest w koszcie — tam
# zadanie zajmuje workera Django i przechodzi caly stos proxy, tutaj konczy sie
# na brzegu. Ochrona sie nie zmienia, zmienia sie cena.
#
# DZIALA WSZEDZIE, TAKZE W /static/ i /media/: regex ma pierwszenstwo przed
# zwyklym prefiksem, wiec ten blok wygrywa z `location /static/` i
# `location /media/`. Wewnetrzny blok w /media/ (nizej) zostaje mimo
# nadmiarowosci — kosztuje zero, a chroni, gdyby ktos kiedys zawezil globalny.
#
# CZEGO TU BYC NIE MOZE: zadnego rozszerzenia, ktore REALNIE serwujemy. `js`,
# `css`, `woff2` sa poprawne w bloku /media/ (tam nic sie nie wykonuje), ale
# globalnie `\.js$` zabiloby cala statyke serwisu — ta sama klasa bledu, dla
# ktorej `.well-known` potrzebowalo `^~` (patrz komentarz wyzej).
location ~* \.(php[0-9]*|phtml|asp|aspx|jsp|jspx|cgi|cfm|exe|dll|jar)$ {
    access_log off;
    error_log /dev/null;
    return 444;
}

# ============================================================================
# PREFIKSY OBCYCH APLIKACJI (WordPress, phpMyAdmin, Tomcat, ...) — 444
# ============================================================================
# Sciezki, ktore NIGDY nie moga byc URL-em BPP. Kryterium doboru: nazwa
# produktowa obcej aplikacji — nie "cos podejrzanego" i nie generyczne slowo
# angielskie (`console`, `debug` swiadomie POMINIETE: moglyby kiedys stac sie
# realna sciezka BPP).
#
# UCZCIWA MIARA WARTOSCI: pomiar 72 h produkcji pokazal ~20 takich zadan, czyli
# ~0,3/h. To NIE jest odpowiedz na biezace obciazenie — appservera nikt tu nie
# zjada. To ubezpieczenie na wypadek, gdyby ktos puscil w serwis pelny slownik.
# NIE rozbudowywac tej listy "na zapas": publiczne slowniki skanerow maja
# dziesiatki tysiecy pozycji, wiec kompletnosc nie jest osiagalna, a kazda
# kolejna pozycja to ryzyko kolizji z przyszlym URL-em BPP.
#
# `(/|$)` NA KONCU JEST KONIECZNE: bez tego `administrator` zlapaloby takze
# `/admin/`, czyli panel Django. Sprawdzono, ze zadna pozycja nie koliduje z
# przestrzenia BPP (/bpp/, /api/, /admin/, /accounts/, /nowe_raporty/, /zglos/,
# /static/, /media/, /grafana/, /dozzle/, /flower/, /netdata/,
# /__external_auth/, /.well-known/).
#
# Aktualizacja listy = pomiar, nie zgadywanie. Zrodlo prawdy to wlasny log:
#   docker logs <webserver> --since 72h | awk '$9==404 {print $7}' \
#     | sed 's/?.*//' | sort | uniq -c | sort -rn | head -40
location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|wordpress|wp|phpmyadmin|pma|myadmin|dbadmin|adminer|administrator|typo3|telescope|_ignition|vendor|actuator|jmx-console|solr|jenkins|manager/html|owa|autodiscover|ecp|_next|_nuxt|cgi-bin|minishell)(/|$) {
    access_log off;
    error_log /dev/null;
    return 444;
}

# ============================================================================
# NIEPODSTAWIONE LITERALY SZABLONOW ({{ ... }}, ${ ... })
# ============================================================================
# Boty (i zepsute frontendy) chodza po URL-ach zawierajacych niepodstawiony
# literal szablonu, np. /bpp/rekord/<slug>/{{ clickURL }}.
#
# POPRZEDNIA WERSJA MIALA DZIURE. Wzorzec brzmial `\{\{\s*clickURL\s*\}\}`, a
# produkcja dostawala `%7B%7B+clickURL+%7D%7D`. Nginx dekoduje `%7B` na `{`
# przed matchowaniem location, ale `+` w SCIEZCE nie jest dekodowany na spacje
# (to konwencja application/x-www-form-urlencoded, dotyczy query stringu) —
# wiec `\s*` nie mialo czego dopasowac i zadanie szlo do Django (404 w logu,
# 11 sztuk na 72 h). Zweryfikowane doswiadczalnie na nginx:alpine: wariant ze
# spacja i bez separatora dawaly 444, wariant z `+` dawal 404.
#
# `[^}]*` zamiast `\s*` przyjmuje spacje, `+`, `%20` i cokolwiek jeszcze
# wygeneruje szablon. Wzorzec jest tez CELOWO szerszy niz sam `clickURL`:
# lapie kazdy niepodstawiony literal `{{...}}` (Angular/Vue/Handlebars) oraz
# `${...}` (template literal JS, realny przypadek:
# /bpp/uczelnia/UP/${todayFeature.link}). Zaden legalny URL BPP nie zawiera
# nawiasow klamrowych.
location ~* (\{\{[^}]*\}\}|\$\{[^}]*\}) {
    access_log off;
    error_log /dev/null;
    return 444;
}

# ============================================================================
# BASIC SERVER CONFIGURATION
# ============================================================================
root /var/www/html;
index index.html index.htm index.nginx-debian.html;

# ============================================================================
# STATIC FILES CONFIGURATION
# ============================================================================
# Serves Django static files with aggressive caching for performance
location /static/ {
    alias /var/www/html/staticroot/;
    expires 30d;
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, immutable";

    # Extended caching for static assets that rarely change
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Performance optimizations
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
}

# ============================================================================
# MEDIA FILES CONFIGURATION
# ============================================================================
# Serves user-uploaded media files with moderate caching
location /media/ {
    alias /mediaroot/;
    expires 7d;
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public";

    # Prevent execution of uploaded files for security
    location ~* \.(php|php3|php4|php5|php7|phtml|pl|py|pyc|pyo|sh|cgi|rb|asp|aspx|exe|com|bat|dll|vbs|js|jar|jsp|jspx)$ {
        deny all;
    }
}

# ============================================================================
# PROTECTED MEDIA FILES (django-sendfile)
# ============================================================================
# Files in /media/protected/ are only accessible via X-Accel-Redirect from Django.
# Direct browser access is blocked - users must go through authenticated views.
location /media/protected/ {
    internal;
    alias /mediaroot/protected/;
}

# ============================================================================
# COMPRESSION CONFIGURATION
# ============================================================================
# Gzip compression for better performance.
# gzip_comp_level 5 — sweet spot: ~65% redukcji HTML/JSON przy pomijalnym
# narzucie CPU vs default level 1 (~45%). Level 6+ to 2x CPU za <2% zysku.
# gzip_vary on — dodaje header Vary: Accept-Encoding, umozliwia poprawne
# cache'owanie w CDN/proxy ktore widza rozne response'y dla gzip i plain.
# text/html NIE moze byc w gzip_types — nginx hardcoduje go, wypluwa warning.
gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1000;
gzip_proxied expired no-cache no-store private auth;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml;
