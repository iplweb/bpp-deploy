# BPP replacement for the stock web_log_web_slow alert (disabled in netdata.conf).
# Absolute thresholds over 5 minutes: alerts when users actually wait, not when
# the 1-minute average briefly doubles. Ignored at low traffic, where a single
# long export would dominate the average.

 template: bpp_web_log_slow
       on: web_log.request_processing_time
    class: Latency
     type: Web Server
component: Web log
   lookup: average -5m unaligned of avg
    units: ms
    every: 1m
     warn: ($web_log_1m_requests > 30) ? ($this > (($status >= $WARNING) ? (2000) : (3000))) : (0)
     crit: ($web_log_1m_requests > 30) ? ($this > (($status == $CRITICAL) ? (7000) : (10000))) : (0)
    delay: down 15m multiplier 1.5 max 1h
  summary: Slow BPP responses
     info: Average HTTP response time over the last 5 minutes
       to: webmaster
